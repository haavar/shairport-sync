// One config for EVERY instance in the multi-instance example. The per-instance
// differences are on the command line (see docker-compose.yaml):
//   --address=<ip>   drives the RTSP bind, the Avahi scope + host-name, the
//                    AirPlay 2 device id, and the nqptp shared-memory name
//   --name="<room>"  the AirPlay name shown to clients
//   -- -d <device>   the ALSA output device
general =
{
      mdns_backend = "avahi";
      service_type = "airplay2";
};
